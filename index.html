<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북 LGU+ X 공공운수전북본부 특별프로모션</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .magenta-text { color: #E6007E; }
        .magenta-bg { background-color: #E6007E; }
        .model-img { transition: transform 0.3s ease; }
        .group:hover .model-img { transform: scale(1.1); }
        @keyframes pulse-custom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-custom {
            animation: pulse-custom 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="pb-20 md:pb-0"> <!-- 하단 고정바 공간 확보 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        
        const App = () => {
            const [formData, setFormData] = useState({
                name: '', phone: '', carrier: '', time: '', model: ''
            });
            const [faqOpen, setFaqOpen] = useState(null);

            React.useEffect(() => {
                lucide.createIcons();
            }, [faqOpen]);

            const handleSubmit = (e) => {
                e.preventDefault();
                alert(`${formData.name}님, 상담 신청이 완료되었습니다. 담당자가 곧 연락드리겠습니다!`);
            };

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const models = [
                { name: "아이폰 17 256G", original: "1,287,000원", price: "17만원 ~", tag: "인기", color: "bg-white", img: "아이폰17.jpg" },
                { name: "아이폰 16 128G", original: "1,243,000원", price: "8만원", tag: "추천", color: "bg-white", img: "아이폰16.jpg" },
                { name: "S25 엣지 / S25 FE", original: "1,496,000원", price: "0원", tag: "공짜폰", color: "bg-white", img: "s25 엣지.jpg" },
                { name: "Z 폴드 7 256G", original: "2,379,300원", price: "117만원", tag: "반값할인!!", color: "bg-white", img: "갤럭시-Z폴드7.jpg" },
                { name: "Z 플립 7 256G", original: "1,643,400원", price: "33만원", tag: "초특가!", color: "bg-white", img: "z플립7.jpg" },
                { name: "스타일폴더 2", original: "237,600원", price: "0원", tag: "부모님추천", color: "bg-white", img: "스타일폴더2.jpg" },
                { name: "A17 키즈폰 8세대", original: "369,500원", price: "0원", tag: "자녀추천", color: "bg-white", img: "a17키즈폰.jpg" },
            ];

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 overflow-x-hidden">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-slate-200 py-3 px-4 md:px-8 shadow-sm">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 border-r pr-4 border-slate-300">
                                    <span className="font-black text-2xl text-[#E6007E]">LGU+</span>
                                </div>
                                <div className="flex flex-col">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">공공운수노조</span>
                                    <span className="text-sm font-black text-slate-800">전북본부 산하 X U+</span>
                                </div>
                            </div>
                            
                            {/* 헤더 연락처 강조 */}
                            <div className="hidden md:flex gap-8 items-center">
                                <a href="tel:010-8081-5972" className="flex items-center gap-3 group">
                                    <div className="w-10 h-10 magenta-bg rounded-full flex items-center justify-center text-white group-hover:scale-110 transition-transform shadow-lg">
                                        <i data-lucide="phone" className="w-5 h-5"></i>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[10px] text-slate-500 font-bold uppercase">본부장 김동현 직통</p>
                                        <p className="text-xl font-black text-[#E6007E]">010-8081-5972</p>
                                    </div>
                                </a>
                                <div className="h-10 w-[1px] bg-slate-200"></div>
                                <div className="text-right">
                                    <p className="text-[10px] text-slate-500 font-bold uppercase">담당 강은경</p>
                                    <p className="text-base font-bold text-slate-700">010-8080-5093</p>
                                </div>
                            </div>

                            <a href="tel:010-8081-5972" className="magenta-bg text-white p-3 rounded-full md:hidden shadow-lg animate-pulse-custom">
                                <i data-lucide="phone-call" className="w-6 h-6"></i>
                            </a>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="relative py-12 md:py-24 bg-slate-900 text-white text-center overflow-hidden px-6">
                        <div className="max-w-4xl mx-auto relative z-10">
                            <div className="inline-block border border-white/30 px-4 py-1 rounded-full text-xs font-bold mb-6 bg-white/10">
                                행사 일정 : ~2026년 3월 31일 | 대상 : 임직원 및 가족 포함
                            </div>
                            <h1 className="text-4xl md:text-6xl font-black mb-8 leading-tight">
                                공공운수전북본부산하 X U+<br />
                                <span className="text-[#E6007E]">임직원 및 가족 특별프로모션</span>
                            </h1>
                            <p className="text-slate-400 mb-10 text-lg font-medium">
                                쓰던 번호 그대로! 85요금제 기준 파격 할인 혜택제공
                            </p>

                            {/* 히어로 섹션 내 연락처 박스 */}
                            <div className="max-w-md mx-auto bg-white/5 border border-white/10 rounded-2xl p-6 backdrop-blur-md mb-8">
                                <p className="text-sm font-bold text-[#E6007E] mb-2">실시간 가입 상담 및 단말기 문의</p>
                                <a href="tel:010-8081-5972" className="flex flex-col items-center gap-1 group">
                                    <span className="text-white/60 text-xs font-medium tracking-widest uppercase">Center Manager</span>
                                    <span className="text-3xl md:text-4xl font-black text-white group-hover:text-[#E6007E] transition-colors">010-8081-5972</span>
                                    <div className="flex items-center gap-2 mt-2 bg-[#E6007E] px-4 py-1.5 rounded-full text-sm font-bold">
                                        <i data-lucide="user" className="w-4 h-4"></i>
                                        본부장 김동현
                                    </div>
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* Special Models Grid */}
                    <section className="py-16 max-w-6xl mx-auto px-6">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-2 h-8 magenta-bg rounded-full"></div>
                                <h2 className="text-3xl font-black italic text-slate-800 tracking-tight uppercase">Special Price Models</h2>
                            </div>
                            <p className="text-[#E6007E] font-bold text-sm bg-pink-50 px-4 py-2 rounded-full border border-pink-100">
                                ※ 85요금제 기준 단말기 할부원금 안내
                            </p>
                        </div>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                            {models.map((model, idx) => (
                                <div key={idx} className={`${model.color} rounded-3xl p-4 md:p-6 border border-slate-200 flex flex-col items-center text-center relative overflow-hidden group hover:border-[#E6007E] transition-all shadow-sm hover:shadow-xl`}>
                                    <span className="absolute top-2 right-2 magenta-bg text-white text-[10px] font-black px-2 py-0.5 rounded italic z-20">
                                        {model.tag}
                                    </span>
                                    <div className="w-full h-40 md:h-48 mb-4 flex items-center justify-center relative overflow-hidden">
                                        <img src={model.img} alt={model.name} className="model-img w-full h-full object-contain p-2" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                        <div className="hidden absolute inset-0 items-center justify-center text-slate-200">
                                            <i data-lucide="smartphone" className="w-16 h-16"></i>
                                        </div>
                                    </div>
                                    <h3 className="font-bold text-slate-800 text-sm md:text-base mb-1">{model.name}</h3>
                                    <p className="text-[11px] text-slate-400 line-through mb-1">{model.original}</p>
                                    <div className="bg-slate-50 px-3 py-2 rounded-full border border-slate-200 group-hover:border-[#E6007E] w-full transition-colors">
                                        <p className="text-[#E6007E] font-black text-sm md:text-lg tracking-tight uppercase">원금 {model.price}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Stats */}
                    <section className="py-10 bg-white border-y border-slate-100">
                        <div className="max-w-6xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                            <div className="p-4">
                                <p className="text-2xl font-black text-[#E6007E]">최대 80만원</p>
                                <p className="text-xs font-bold text-slate-500 mt-1 italic">가구당 최대 할인액</p>
                            </div>
                            <div className="p-4 border-l border-slate-100">
                                <p className="text-2xl font-black text-[#E6007E]">100% 적용</p>
                                <p className="text-xs font-bold text-slate-500 mt-1 italic">임직원 가족 동일 혜택</p>
                            </div>
                            <div className="p-4 border-l border-slate-100">
                                <p className="text-2xl font-black text-[#E6007E]">현금 지급</p>
                                <p className="text-xs font-bold text-slate-500 mt-1 italic">유심 변경 시 20만원</p>
                            </div>
                            <div className="p-4 border-l border-slate-100">
                                <p className="text-2xl font-black text-[#E6007E]">TV 증정</p>
                                <p className="text-xs font-bold text-slate-500 mt-1 italic">인터넷+TV 결합 시</p>
                            </div>
                        </div>
                    </section>

                    {/* Benefits */}
                    <section className="py-16 bg-[#E6007E]/5">
                        <div className="max-w-6xl mx-auto px-6 text-center">
                            <h2 className="text-3xl font-black text-slate-900 mb-2 italic uppercase">Extra Benefits</h2>
                            <p className="text-slate-500 font-bold mb-12">휴대폰 구매를 넘어 통신비 전반의 혜택을 드립니다</p>

                            <div className="grid md:grid-cols-2 gap-8 text-left">
                                <div className="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-[#E6007E] flex items-start gap-6">
                                    <div className="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center text-[#E6007E] shrink-0">
                                        <i data-lucide="coins" className="w-8 h-8"></i>
                                    </div>
                                    <div>
                                        <span className="text-[#E6007E] font-black text-xs uppercase tracking-widest mb-1 block">Benefit 01</span>
                                        <h3 className="text-xl font-black mb-2 leading-tight">쓰던 폰 그대로<br />유심만 변경해도?</h3>
                                        <p className="text-slate-600 text-sm font-bold leading-relaxed mb-4">
                                            새 폰을 사지 않아도 번호이동 시 <span className="text-[#E6007E] text-lg">현금 지급 20만원!</span><br />
                                            (85요금제 기준 / 통신사 이동 시 제공)
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-slate-900 p-8 rounded-3xl shadow-xl text-white flex items-start gap-6 relative overflow-hidden">
                                    <div className="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-white shrink-0">
                                        <i data-lucide="tv" className="w-8 h-8"></i>
                                    </div>
                                    <div>
                                        <span className="text-[#E6007E] font-black text-xs uppercase tracking-widest mb-1 block">Benefit 02</span>
                                        <h3 className="text-xl font-black mb-2 italic text-white">삼성/LG 65" TV 증정!</h3>
                                        <p className="text-slate-300 text-sm font-bold leading-relaxed mb-4">
                                            모바일 + 인터넷 + TV 동시 가입 시<br />
                                            <span className="text-[#E6007E] text-lg">65인치 TV 증정 OR 100만원 현금지급!</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Apply Form */}
                    <section id="apply-form" className="py-16 max-w-4xl mx-auto px-6">
                        <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
                            <div className="p-8 md:p-12">
                                <div className="text-center mb-10">
                                    <h2 className="text-3xl font-black mb-2 italic uppercase">Consultation</h2>
                                    <p className="text-slate-500 font-bold underline decoration-[#E6007E] underline-offset-4">부재 시 문자 남겨주시면 김동현 본부장이 직접 연락드립니다</p>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="space-y-5">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <input required type="text" name="name" placeholder="성함" onChange={handleChange} className="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#E6007E] outline-none font-bold" />
                                        <input required type="tel" name="phone" placeholder="연락처 (010-0000-0000)" onChange={handleChange} className="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#E6007E] outline-none font-bold" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <select name="carrier" onChange={handleChange} className="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none">
                                            <option value="">현재 이용 통신사</option>
                                            <option value="SKT">SKT</option>
                                            <option value="KT">KT</option>
                                            <option value="LGU+">LGU+</option>
                                            <option value="알뜰폰">알뜰폰</option>
                                        </select>
                                        <select name="time" onChange={handleChange} className="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none">
                                            <option value="">희망 상담 시간</option>
                                            <option value="10:00~13:00">오전 (10:00~13:00)</option>
                                            <option value="13:00~17:00">오후 (13:00~17:00)</option>
                                            <option value="17:00~20:00">저녁 (17:00~20:00)</option>
                                        </select>
                                    </div>
                                    <input type="text" name="model" placeholder="관심 모델 (예: 아이폰 17, 유심변경 등)" onChange={handleChange} className="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#E6007E] outline-none font-bold" />
                                    <button type="submit" className="w-full py-5 magenta-bg text-white text-xl font-black rounded-xl shadow-lg hover:opacity-90 transition-opacity">
                                        특별 프로모션 혜택 신청하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section className="py-20 max-w-4xl mx-auto px-6">
                        <h2 className="text-2xl font-black text-center mb-10">자주 묻는 질문</h2>
                        <div className="space-y-3">
                            {[
                                { q: "위약금 지원이 되나요?", a: "네, 김동현 본부장이 직접 현재 약정 상태를 파악하여 위약금을 최소화하거나 지원해드릴 수 있는 정책을 설계해 드립니다." },
                                { q: "가족들도 똑같이 혜택을 받을 수 있나요?", a: "네, 건강보험자격득실확인서 등을 통해 가족 증빙 시 임직원과 동일한 파격 정책이 적용됩니다." },
                                { q: "유심만 변경해도 현금을 주나요?", a: "네, 쓰던 폰 그대로 번호이동 시 85요금제 기준으로 현금 20만원 지급 혜택을 드리고 있습니다." }
                            ].map((item, idx) => (
                                <div key={idx} className="border border-slate-200 rounded-2xl bg-white overflow-hidden shadow-sm">
                                    <button onClick={() => setFaqOpen(faqOpen === idx ? null : idx)} className="w-full flex items-center justify-between p-5 text-left font-bold text-slate-800">
                                        <span>{item.q}</span>
                                        <i data-lucide="chevron-down" className={`transition-transform w-5 h-5 ${faqOpen === idx ? 'rotate-180' : ''}`}></i>
                                    </button>
                                    {faqOpen === idx && <div className="px-5 pb-5 text-slate-500 text-sm leading-relaxed border-t border-slate-50 pt-3">{item.a}</div>}
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-12 px-6 text-slate-600 mb-20 md:mb-0">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between gap-10">
                            <div>
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="font-black text-xl text-[#E6007E]">LGU+</span>
                                    <span className="text-sm font-bold text-slate-800">전북소매영업팀 (주)더좋은</span>
                                </div>
                                <p className="text-[11px] text-slate-400 leading-relaxed font-bold">
                                    법인사업자 번호 : 214911-0056997<br />
                                    전주 8개점, 익산 4개점, 정읍 1개점, 김제 2개점, 부안 1개점 (총 16개점 운영)<br />
                                    본 페이지는 공공운수노조 전북본부 산하 임직원 전용 공식 프로모션 페이지입니다.
                                </p>
                            </div>
                            
                            <div className="space-y-4">
                                <h4 className="font-black text-sm uppercase tracking-widest text-slate-400">Official Contact</h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-bold text-slate-500">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <p className="text-[10px] text-slate-400 font-black mb-1">총괄 본부장 김동현</p>
                                        <p className="font-black text-lg text-[#E6007E]">010-8081-5972</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                        <p className="text-[10px] text-slate-400 font-black mb-1">상담 담당 강은경</p>
                                        <p className="font-black text-lg text-slate-700">010-8080-5093</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* 화면 하단 고정 상담바 (모바일 최적화) */}
                    <div className="fixed bottom-0 left-0 right-0 z-[100] bg-white border-t border-slate-200 p-3 md:hidden shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
                        <a href="tel:010-8081-5972" className="flex items-center justify-between magenta-bg text-white px-5 py-3 rounded-2xl font-black shadow-lg">
                            <div className="flex items-center gap-3">
                                <i data-lucide="phone-call" className="w-5 h-5"></i>
                                <span>김동현 본부장 직통 상담</span>
                            </div>
                            <span className="text-sm opacity-80 underline underline-offset-2">연결하기</span>
                        </a>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
